openapi: 3.0.3
info:
  title: Homeo sapiens Admin API
  version: 0.1.0
  description: >
    Internal admin dashboard API. Every endpoint is served behind an
    authenticated admin session (see the /api/admin mount in web/router),
    so there is no per-endpoint or per-field authorization in the schema.


    List endpoints share a common pagination contract: they accept `page`
    and `perPage` query parameters and return an envelope with a `data`
    array and a `pagination` metadata object. Resource payloads are flat -
    associations (hosts, prices, registrations, ...) are intentionally
    omitted from the list representations.
servers:
  - url: /api/admin

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /session:
    get:
      operationId: getSession
      summary: Get the currently signed in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      summary: List users
      description: >
        Optionally filtered by `search`. Because user PII is encrypted at rest,
        the filter has two paths: an email-shaped term is matched exactly against
        the `email_hash` blind index (at most one result); any other term is
        matched as a case-insensitive substring against the decrypted given and
        family names, scanned in application code (unindexed, O(n)).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: search
          in: query
          required: false
          description: >
            Filter term. An email address is matched exactly via the email_hash
            index; any other value is a case-insensitive substring match on
            decrypted given/family names.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: A page of users, ordered by insertion time (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /users/{id}:
    get:
      operationId: getUser
      summary: Get user data
      parameters:
        - name: id
          in: path
          required: true
          description: User primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The data of the requested User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "404":
          description: No user found with this ID.

  /videos:
    get:
      operationId: listVideos
      summary: List videos
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of videos, ordered by ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVideos"

  /videos/{id}:
    get:
      operationId: getVideo
      summary: Get a single video by primary key
      parameters:
        - name: id
          in: path
          required: true
          description: Video primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetails"
        "404":
          description: No video found with this ID.
    patch:
      operationId: updateVideo
      summary: Update a video
      description: >
        Every editable field is required, so an update replaces the admin-owned
        part of the record wholesale.
      parameters:
        - name: id
          in: path
          required: true
          description: Video primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoInput"
      responses:
        "200":
          description: The updated video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetails"
        "404":
          description: No video found with this ID.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events:
    get:
      operationId: listEvents
      summary: List events
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of events, ordered by start time (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEvents"
    post:
      operationId: createEvent
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: The created event
          headers:
            Location:
              description: URL of the created event.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events/{id}:
    get:
      operationId: getEvent
      summary: Get a single event by primary key
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "404":
          description: No event with that id
    patch:
      operationId: updateEvent
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventInput"
      responses:
        "200":
          description: The updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "404":
          description: No event with that id
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

    delete:
      operationId: deleteEvent
      summary: Delete an event
      description: >-
        Permanently deletes an event and its host associations. Refused with a
        409 once anyone has signed up: registrations are the record of who is
        owed a seat, so a live event is retired by unpublishing it instead. Any
        product created for the event is left behind, because order line items
        reference it.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the event has been deleted
        "404":
          description: No event with that id
        "409":
          description: The event has registrations and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events/{id}/publish:
    post:
      operationId: publishEvent
      summary: Mark an event as published.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the event has been successfully published
        "404":
          description: No event with that id
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events/{id}/unpublish:
    post:
      operationId: unpublishEvent
      summary: Take an event off the public listing.
      description: >-
        Clears publishedAt. Always allowed, including for an event with
        registrations: existing sign-ups keep their record of the event, it just
        stops being listed and joinable. Unpublishing a draft is a no-op.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the event is no longer published
        "404":
          description: No event with that ID.

  /events/{id}/attendants:
    get:
      operationId: listEventAttendants
      summary: List users signed up for the event.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Lists all users signed up for the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventAttendants"
        "404":
          description: No event with that ID.

  /events/{id}/eligible-users:
    get:
      operationId: listEligibleUsersForEvent
      summary: List users alongside enrolment status for an event
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Search term
          schema:
            type: string
      responses:
        "200":
          description: Lists users matching the query with enrollment status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListEligibleUsersForEventRow"

  /event-registrations:
    post:
      operationId: enrollStudentForEvent
      summary: Registers a user for an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollStudentForEventInput"

      responses:
        "200":
          description: The created EventRegistration object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"

        "404":
          description: No event with that ID

        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /video-groups:
    get:
      operationId: listVideoGroups
      summary: List video groups
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of video groups, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVideoGroups"
    post:
      operationId: createVideoGroup
      summary: Create a video group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGroupInput"
      responses:
        "201":
          description: The created video group
          headers:
            Location:
              description: URL of the created video group.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGroup"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /video-groups/{id}:
    get:
      operationId: getVideoGroup
      summary: Get a single video group by primary key
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested video group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGroup"
        "404":
          description: No video group with that ID.
    patch:
      operationId: updateVideoGroup
      summary: Update a video group
      description: Applies a partial update. Absent fields are left untouched.
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGroupPatch"
      responses:
        "200":
          description: The updated video group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGroup"
        "404":
          description: No video group with that ID.
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /video-groups/{id}/videos:
    get:
      operationId: listVideosInVideoGroup
      summary: List the videos of a group, in playback order
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The videos of the group, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "404":
          description: No video group with that ID.
    put:
      operationId: replaceVideosInVideoGroup
      summary: Replace the videos of a group
      description: >-
        Sets the group's videos to exactly the given list, in the given order.
        Positions are unique per group, so membership and order are replaced
        wholesale rather than patched one video at a time.
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGroupVideosInput"
      responses:
        "200":
          description: The videos of the group, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "404":
          description: No video group with that ID.
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /hosts:
    get:
      operationId: listHosts
      summary: List hosts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of hosts, ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedHosts"
    post:
      operationId: createHost
      summary: Create a host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostInput"
      responses:
        "201":
          description: The created host
          headers:
            Location:
              description: URL of the created host.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /hosts/{id}:
    get:
      operationId: getHost
      summary: Get a single host by primary key
      parameters:
        - name: id
          in: path
          required: true
          description: Host primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          description: No host found with this ID.
    patch:
      operationId: updateHost
      summary: Update a host
      description: >
        Every editable field is required, so an update replaces the whole
        record; there is no partial-update shape for a host.
      parameters:
        - name: id
          in: path
          required: true
          description: Host primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostInput"
      responses:
        "200":
          description: The updated host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          description: No host found with this ID.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
    delete:
      operationId: deleteHost
      summary: Delete a host
      description: >
        Only hosts that are not referenced by any event or video can be
        deleted; the database rejects the rest.
      parameters:
        - name: id
          in: path
          required: true
          description: Host primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the host is gone.
        "404":
          description: No host found with this ID.
        "409":
          description: The host is still referenced by an event or a video.

  /blog-posts:
    get:
      operationId: listBlogPosts
      summary: List blog posts
      responses:
        "200":
          description: List of all blog posts, ordered by ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

    post:
      operationId: createBlogPost
      summary: Create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlogPostInput"
      responses:
        "201":
          description: The created blog post
          headers:
            Location:
              description: URL of the created blog post
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /blog-posts/{id}:
    get:
      operationId: getBlogPost
      description: Get blog post data
      parameters:
        - name: id
          in: path
          required: true
          description: Blog post primary key
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The data of the requested blog post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: No blog post found with this ID.
    patch:
      operationId: updateBlogPost
      description: Updates a blog post
      parameters:
        - name: id
          in: path
          required: true
          description: Blog post primary key
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBlogPostInput"
      responses:
        "200":
          description: The updated blog post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: No blog post found with this ID.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /blog-posts/{id}/publish:
    post:
      operationId: publishBlogPost
      description: Publishes a blog post
      parameters:
        - name: id
          in: path
          required: true
          description: Blog post primary key
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the post has been successfully published.
        "404":
          description: No post with that ID.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /blog-posts/{id}/unpublish:
    post:
      operationId: unpublishBlogPost
      description: Converts a published blog post back to a draft.
      parameters:
        - name: id
          in: path
          required: true
          description: Blog post primary key
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the post is no longer published.
        "404":
          description: No post with that ID.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /products:
    get:
      operationId: listProducts
      summary: List products
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of products, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      description: >
        Orders newest first. Buyer name and email are decrypted from the
        encrypted columns in application code, so this endpoint returns PII
        in plaintext.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of orders, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"

  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get a single order by primary key
      description: >
        The full order, including its line items and the decrypted billing
        address. Everything the admin needs to answer a question about a
        purchase is on this payload.
      parameters:
        - name: id
          in: path
          required: true
          description: Order primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetails"
        "404":
          description: No order found with this ID.

components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number. Values below 1 are treated as 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      required: false
      description: Number of items per page. Clamped to the [1, 100] range.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Pagination:
      type: object
      description: Pagination metadata describing the returned page.
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          description: The 1-based page number that was returned.
        perPage:
          type: integer
          format: int32
          minimum: 1
          description: The effective page size after clamping.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of items across all pages.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Total number of pages given the effective page size.

    PaginatedUsers:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedVideos:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedEvents:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedEventAttendants:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: 
            $ref: "#/components/schemas/EventAttendant"
        pagination:
          $ref: "#/components/schemas/Pagination"
      
    PaginatedOrders:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Order:
      type: object
      description: A single purchase. Line items are omitted from the list representation.
      required:
        [
          id,
          orderNumber,
          status,
          grandTotal,
          currency,
          email,
          givenName,
          familyName,
          billingCountry,
          insertedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          description: Human-facing order number, generated by the database.
        status:
          $ref: "#/components/schemas/OrderStatus"
        grandTotal:
          type: string
          description: Decimal total string, e.g. "199.00".
        currency:
          type: string
        email:
          type: string
          format: email
          description: Buyer email, decrypted.
        givenName:
          type: string
          description: Billing given name, decrypted.
        familyName:
          type: string
          description: Billing family name, decrypted.
        billingCountry:
          type: string
