openapi: 3.0.3
info:
  title: Homeo sapiens Admin API
  version: 0.1.0
  description: >
    Internal admin dashboard API. Every endpoint is served behind an
    authenticated admin session (see the /api/admin mount in web/router),
    so there is no per-endpoint or per-field authorization in the schema.


    List endpoints share a common pagination contract: they accept `page`
    and `perPage` query parameters and return an envelope with a `data`
    array and a `pagination` metadata object. Resource payloads are flat -
    associations (hosts, prices, registrations, ...) are intentionally
    omitted from the list representations.
servers:
  - url: /api/admin

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /session:
    get:
      operationId: getSession
      summary: Get the currently signed in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      summary: List users
      description: >
        Optionally filtered by `search`. Because user PII is encrypted at rest,
        the filter has two paths: an email-shaped term is matched exactly against
        the `email_hash` blind index (at most one result); any other term is
        matched as a case-insensitive substring against the decrypted given and
        family names, scanned in application code (unindexed, O(n)).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - name: search
          in: query
          required: false
          description: >
            Filter term. An email address is matched exactly via the email_hash
            index; any other value is a case-insensitive substring match on
            decrypted given/family names.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: A page of users, ordered by insertion time (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /videos:
    get:
      operationId: listVideos
      summary: List videos
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of videos, ordered by ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVideos"

  /events:
    get:
      operationId: listEvents
      summary: List events
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of events, ordered by start time (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEvents"
    post:
      operationId: createEvent
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: The created event
          headers:
            Location:
              description: URL of the created event.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events/{id}:
    get:
      operationId: getEvent
      summary: Get a single event by primary key
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "404":
          description: No event with that id
    patch:
      operationId: updateEvent
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEventInput"
      responses:
        "200":
          description: The updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "404":
          description: No event with that id
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

    delete:
      operationId: deleteEvent
      summary: Delete an event
      description: >-
        Permanently deletes an event and its host associations. Refused with a
        409 once anyone has signed up: registrations are the record of who is
        owed a seat, so a live event is retired by unpublishing it instead. Any
        product created for the event is left behind, because order line items
        reference it.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the event has been deleted
        "404":
          description: No event with that id
        "409":
          description: The event has registrations and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events/{id}/publish:
    post:
      operationId: publishEvent
      summary: Mark an event as published.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the event has been successfully published
        "404":
          description: No event with that id
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /events/{id}/unpublish:
    post:
      operationId: unpublishEvent
      summary: Take an event off the public listing.
      description: >-
        Clears publishedAt. Always allowed, including for an event with
        registrations: existing sign-ups keep their record of the event, it just
        stops being listed and joinable. Unpublishing a draft is a no-op.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Confirms that the event is no longer published
        "404":
          description: No event with that ID.

  /events/{id}/attendants:
    get:
      operationId: listEventAttendants
      summary: List users signed up for the event.
      parameters:
        - name: id
          in: path
          required: true
          description: Event primary key
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Lists all users signed up for the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventAttendants"
        "404":
          description: No event with that ID.

  /video-groups:
    get:
      operationId: listVideoGroups
      summary: List video groups
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of video groups, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVideoGroups"
    post:
      operationId: createVideoGroup
      summary: Create a video group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGroupInput"
      responses:
        "201":
          description: The created video group
          headers:
            Location:
              description: URL of the created video group.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGroup"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /video-groups/{id}:
    get:
      operationId: getVideoGroup
      summary: Get a single video group by primary key
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested video group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGroup"
        "404":
          description: No video group with that ID.
    patch:
      operationId: updateVideoGroup
      summary: Update a video group
      description: Applies a partial update. Absent fields are left untouched.
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGroupPatch"
      responses:
        "200":
          description: The updated video group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGroup"
        "404":
          description: No video group with that ID.
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /video-groups/{id}/videos:
    get:
      operationId: listVideosInVideoGroup
      summary: List the videos of a group, in playback order
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The videos of the group, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "404":
          description: No video group with that ID.
    put:
      operationId: replaceVideosInVideoGroup
      summary: Replace the videos of a group
      description: >-
        Sets the group's videos to exactly the given list, in the given order.
        Positions are unique per group, so membership and order are replaced
        wholesale rather than patched one video at a time.
      parameters:
        - name: id
          in: path
          required: true
          description: Video group primary key.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGroupVideosInput"
      responses:
        "200":
          description: The videos of the group, ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "404":
          description: No video group with that ID.
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /hosts:
    get:
      operationId: listHosts
      summary: List hosts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: A page of hosts, ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedHosts"

components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number. Values below 1 are treated as 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      required: false
      description: Number of items per page. Clamped to the [1, 100] range.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Pagination:
      type: object
      description: Pagination metadata describing the returned page.
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          description: The 1-based page number that was returned.
        perPage:
          type: integer
          format: int32
          minimum: 1
          description: The effective page size after clamping.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of items across all pages.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Total number of pages given the effective page size.

    PaginatedUsers:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedVideos:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedEvents:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedEventAttendants:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: 
            $ref: "#/components/schemas/EventAttendant"
        pagination:
          $ref: "#/components/schemas/Pagination"
      
    PaginatedVideoGroups:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VideoGroup"
        pagination:
          $ref: "#/components/schemas/Pagination"

    VideoGroup:
      type: object
      description: A series of videos. A group with a price is only watchable by users who bought it.
      required: [id, slug, titlePl, titleEn, isPremium, videoCount, insertedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titlePl:
          type: string
        titleEn:
          type: string
        isPremium:
          type: boolean
          description: Whether the group is behind the paywall, i.e. has a product.
        price:
          type: string
          nullable: true
          description: Decimal price string, e.g. "199.00". Null when the group is free.
        currency:
          type: string
          nullable: true
          description: Currency code. Null when the group is free.
        videoCount:
          type: integer
          format: int32
        insertedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VideoGroupInput:
      type: object
      description: Editable fields of a video group, used on create.
      required: [slug, titlePl, titleEn]
      properties:
        slug:
          type: string
        titlePl:
          type: string
        titleEn:
          type: string
        price:
          type: string
          nullable: true
          description: Decimal price string. A null or zero price leaves the group free.
        currency:
          type: string
          nullable: true
          description: Required when a non-zero price is given.

    VideoGroupVideosInput:
      type: object
      required: [videoIds]
      properties:
        videoIds:
          type: array
          description: IDs of the videos in the group, in playback order. Replaces the existing set wholesale.
          items:
            type: string
            format: uuid

    VideoGroupPatch:
      type: object
      description: >-
        Partial update of a video group. Absent fields are left untouched;
        a nullable field may be cleared by passing an explicit null.
      x-go-type: types.PatchVideoGroupInput
      x-go-type-import:
        path: github.com/moroz/homeosapiens-go/types
      properties:
        slug:
          type: string
        titlePl:
          type: string
        titleEn:
          type: string
        price:
          type: string
          nullable: true
          description: Decimal price string. Zero or null makes the group free without discarding its product.
        currency:
          type: string
          nullable: true

    PaginatedHosts:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        pagination:
          $ref: "#/components/schemas/Pagination"

    User:
      type: object
      required: [id, email, givenName, familyName, role, preferredLocale, insertedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        givenName:
          type: string
        familyName:
          type: string
        role:
          type: string
          enum: [Regular, Administrator]
        preferredLocale:
          type: string
          description: Locale code, e.g. pl or en
        emailConfirmedAt:
          type: string
          format: date-time
          nullable: true
        insertedAt:
          type: string
          format: date-time
        profilePicture:
          type: string
          format: uri

    Video:
      type: object
      required: [id, slug, titlePl, titleEn]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titlePl:
          type: string
        titleEn:
          type: string
        recordedOn:
          type: string
          format: date-time
          nullable: true

    Event:
      type: object
      required: [id, slug, titlePl, titleEn, eventType, isVirtual, startsAt, endsAt, insertedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        titlePl:
          type: string
        titleEn:
          type: string
        subtitlePl:
          type: string
          nullable: true
        subtitleEn:
          type: string
          nullable: true
        eventType:
          type: string
        isVirtual:
          type: boolean
        meetingUrl:
          type: string
          format: uri
          nullable: true
          description: Join link for a virtual meeting, sent out with registration confirmations and reminders.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        insertedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time

    EventDetails:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [isFree, hosts]
          properties:
            descriptionPl:
              type: string
              nullable: true
            descriptionEn:
              type: string
              nullable: true
            isFree:
              type: boolean
            price:
              type: string
              nullable: true
              description: Decimal price string, e.g. "19.99". Null when free.
            currency:
              type: string
              nullable: true
              description: Currency code. Null when free.
            hosts:
              type: array
              items:
                $ref: "#/components/schemas/Host"
            venueNameEn:
              type: string
              nullable: true
            venueNamePl:
              type: string
              nullable: true
            venueStreet:
              type: string
              nullable: true
            venueCityEn:
              type: string
              nullable: true
            venueCityPl:
              type: string
              nullable: true
            venuePostalCode:
              type: string
              nullable: true
            venueCountryCode:
              type: string
              nullable: true
              description: ISO 3166-1 alpha-2 country code

    EventAttendant:
      type: object
      description: A subset of User fields used in the context of event attendance.
      required: [id, givenName, familyName, email, insertedAt]
      properties:
        id:
          type: string
          format: uuid
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
          format: email
        insertedAt:
          type: string
          format: date-time

    EventInput:
      type: object
      description: Editable fields of an event, used for both create and update. Server-managed fields (id, insertedAt, updatedAt) are ignored.
      required: [slug, titlePl, titleEn, eventType, isVirtual, startsAt, endsAt, hostIds]
      properties:
        slug:
          type: string
        titlePl:
          type: string
        titleEn:
          type: string
        subtitlePl:
          type: string
          nullable: true
        subtitleEn:
          type: string
          nullable: true
        eventType:
          type: string
        isVirtual:
          type: boolean
        meetingUrl:
          type: string
          format: uri
          nullable: true
          description: Join link for a virtual meeting, sent out with registration confirmations and reminders.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        descriptionPl:
          type: string
          nullable: true
        descriptionEn:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: Decimal price string, e.g. "19.99". Null when free. A null or zero price makes the event free.
        currency:
          type: string
          nullable: true
          description: Currency code. Null when free.
        hostIds:
          type: array
          description: IDs of hosts associated with the event.
          items:
            type: string
            format: uuid
        venueNameEn:
          type: string
          nullable: true
        venueNamePl:
          type: string
          nullable: true
        venueStreet:
          type: string
          nullable: true
        venueCityEn:
          type: string
          nullable: true
        venueCityPl:
          type: string
          nullable: true
        venuePostalCode:
          type: string
          nullable: true
        venueCountryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code

    PatchEventInput:
      type: object
      description: >-
        Selective update of an event. Every field is optional: absent fields
        are left untouched, and fields backed by a nullable column may be
        cleared by passing an explicit null.
      x-go-type: types.PatchEventInput
      x-go-type-import:
        path: github.com/moroz/homeosapiens-go/types
      properties:
        titleEn:
          type: string
        titlePl:
          type: string
        slug:
          type: string
        subtitleEn:
          type: string
          nullable: true
        subtitlePl:
          type: string
          nullable: true
        descriptionEn:
          type: string
          nullable: true
        descriptionPl:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: Decimal price string, e.g. "19.99". Null when free.
        currency:
          type: string
          nullable: true
          description: Currency code. Null when free.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        hostIds:
          type: array
          description: IDs of hosts associated with the event. Replaces the existing set wholesale.
          items:
            type: string
            format: uuid
        isVirtual:
          type: boolean
          description: >-
            Flipping this to false requires the event to end up with a full
            venue, whether the address comes from this payload or is already
            stored on the event.
        meetingUrl:
          type: string
          format: uri
          nullable: true
          description: Join link for a virtual meeting. Null clears the stored link.
        venueNameEn:
          type: string
          nullable: true
        venueNamePl:
          type: string
          nullable: true
        venueStreet:
          type: string
          nullable: true
        venueCityEn:
          type: string
          nullable: true
        venueCityPl:
          type: string
          nullable: true
        venuePostalCode:
          type: string
          nullable: true
        venueCountryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code

    ValidationErrors:
      type: object
      description: Map of field name to validation error message(s) for that field.
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: string

    Host:
      type: object
      required: [id, givenName, familyName]
      properties:
        id:
          type: string
          format: uuid
        salutation:
          type: string
          nullable: true
          description: i18n message key, e.g. common.hosts.salutation.dr
        givenName:
          type: string
        familyName:
          type: string
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code
