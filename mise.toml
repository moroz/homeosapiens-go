[tools]
age = "latest"
"aqua:axllent/mailpit" = "latest"
caddy = "latest"
go = "1.27"
"go:github.com/air-verse/air" = "latest"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "latest"
"go:github.com/pressly/goose/v3/cmd/goose" = "latest"
"go:github.com/riverqueue/river/cmd/river" = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
"go:github.com/vektra/mockery/v3" = "v3.7.0"
jq = "latest"
node = "latest"
overmind = "latest"
"pipx:ansible" = "latest"
pnpm = "latest"
prettier = "latest"
python = "latest"
sops = "latest"
stripe = "latest"
uv = "latest"
xh = "latest"

[settings.age]
key_file = "~/.ssh/id_ed25519"

[env]
PGDATABASE = "homeosapiens_dev"
PGUSER = "postgres"
PGPASSWORD = "postgres"
PGHOST = "localhost"
DATABASE_URL = "postgres://postgres:postgres@localhost:5432/{{ env.PGDATABASE }}?options=-c%20TimeZone%3DUTC"
GOOSE_DBSTRING = "{{ env.DATABASE_URL }}"
GOOSE_DRIVER = "postgres"
GOOSE_MIGRATION_DIR = "db/migrations"
SECRET_KEY_BASE = "YhTVeJ58o+vuYEvASxp68UMydUhvMsAOQZkCmlEeAE/IVJ/WkpjXS0+spVyWttR0ZMs0aKbbx+jkqV7oD9Lp+w=="
TEST_DATABASE = "homeosapiens_test"
TEST_DATABASE_URL = "postgres://{{ env.PGUSER }}:{{ env.PGPASSWORD }}@{{ env.PGHOST }}:5432/{{ env.TEST_DATABASE }}?options=-c%20TimeZone%3DUTC"
STRIPE_SECRET_KEY = { age = "" }
STRIPE_PUBLISHABLE_KEY = "pk_test_51TFe1mCyj9ryWA1RRFNkwsVRIZbLncoY4rejdPwjd6nPGYgY2qTYJvMvMlnfcfF9gAPjzUvoDf3Gz7CWpvvDi92A00mI4ZMDBT"
PUBLIC_URL = "http://localhost:5000"
PORT = "5000"

STRIPE_LISTEN_TO_EVENTS = "checkout.session.completed"
GOOGLE_CLIENT_ID = { age = "" }
GOOGLE_CLIENT_SECRET = { age = "" }
STRIPE_WEBHOOK_SIGNING_SECRET = { age = "" }

[tasks.setup]
depends = ["caddy:permit"]
run = """
#!/usr/bin/env -S bash -euo pipefail

cd assets && pnpm install && cd ..
mise db:setup
"""

[tasks.restart]
run = """
#!/usr/bin/env -S bash -euo pipefail

if [[ -S .overmind.sock ]]; then
  overmind restart air
fi
"""

[tasks."db:seed"]
run = """
#!/usr/bin/env -S bash -euo pipefail

TABLES=(assets products events hosts video_groups video_groups_videos videos product_prices events_hosts video_hosts)

psql $DATABASE_URL -c "truncate $(IFS=,; echo "${TABLES[*]}") cascade;"
psql $DATABASE_URL -f db/seeds/data.sql >/dev/null
(cd db/seeds && go run .)
mise restart
"""

[tasks."db:seed:dump"]
run = """
#!/usr/bin/env -S bash -euo pipefail

TABLES=(assets products events hosts video_groups video_groups_videos videos product_prices events_hosts video_sources video_hosts)

tables_option="$(printf ' -t %s' "${TABLES[@]}")"

pg_dump -Fp $DATABASE_URL --data-only --inserts --no-comments $tables_option -f db/seeds/data.sql
"""

[tasks."db:setup"]
run = """
#!/usr/bin/env -S bash -euo pipefail

createdb $PGDATABASE || true
psql -c "alter database $PGDATABASE set timezone to 'UTC'"
goose up
mise db:seed
"""

[tasks."db:reset"]
run = """
#!/usr/bin/env -S bash -euo pipefail

dropdb $PGDATABASE --force
mise r db:setup
mise restart
"""

[tasks."db:test:prepare"]
run = """
#!/usr/bin/env -S bash -euo pipefail

if [[ ! -n "$TEST_DATABASE" ]]; then
  echo "TEST_DATABASE is not set!"
  exit 1
fi

EXISTS="$(psql -tA postgres -c "select s.exists from (select exists (select from pg_database where datname = '$TEST_DATABASE')) s;")"

export TEST_DATABASE_URL=postgres://$PGUSER:$PGPASSWORD@$PGHOST:5432/$TEST_DATABASE
export GOOSE_DBSTRING=$TEST_DATABASE_URL

if [[ "$EXISTS" = "f" ]]; then
  createdb $TEST_DATABASE
fi

goose up
psql $TEST_DATABASE_URL -c "truncate river_job"
"""

[tasks.test]
depends = ["db:test:prepare"]
run = "env GO_ENV=test go test -v ./..."

[tasks."format.css"]
run = "scripts/format-classes.mjs tmpl/**/*.go"

[tasks."format.json"]
run = """
#!/usr/bin/env -S bash -euo pipefail

for file in i18n/*.json; do
  jq -r . -S $file | sponge $file
done
"""

[tasks."seeds:build"]
description = "Builds the seed program for use in production"
run = """
#!/usr/bin/env -S bash -euo pipefail

cd db/seeds
GOOS=linux GOARCH=amd64 go build .
"""

[tasks."deploy:staging"]
run = "cd scripts/deploy && ansible-playbook -v deploy.yml --limit staging"

[tasks."deploy:prod"]
run = "cd scripts/deploy && ansible-playbook -v deploy.yml --limit prod"

[tasks.check]
run = "go run ."
dir = "scripts/check-locales"

[tasks.watch]
run = "overmind start"
depends = ["caddy:permit"]

[tasks."caddy:permit"]
run = """
#!/usr/bin/env -S bash -euo pipefail

if [[ $(uname) = "Linux" ]]; then
  getcap $(mise which caddy) | grep -q 'cap_net_bind_service' || sudo setcap 'cap_net_bind_service=+ep' $(mise which caddy)
fi
"""

[tasks.gen]
run = """
sqlc generate
go generate ./...
cd admin && pnpm run gen:api
"""
